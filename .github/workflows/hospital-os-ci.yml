name: Hospital OS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Lint, unit tests, and smoke tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Production readiness report
        run: npm run prod:check -- --report-only

      - name: Auth & RBAC flow regression checks
        run: |
          NEXT_DIST_DIR=.next-e2e npm run dev -- --hostname 127.0.0.1 --port 3100 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3100/mudgalgastromedics-os > /dev/null && break
            sleep 2
          done
          npm run verify:auth

      - name: Hospital OS Playwright and axe checks
        run: npm run test:e2e
