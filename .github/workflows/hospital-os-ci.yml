name: Hospital OS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Lint, unit tests, and smoke tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Production readiness report
        run: npm run prod:check -- --report-only

      - name: Hospital OS Playwright and axe checks
        run: npm run test:e2e
